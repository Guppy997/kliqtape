         App verhält sich wie eine native App, kein Dokument zum Reinzoomen —

         Fehler aus (abgeschnittener Rand statt erkennbarer Zoom-Zustand). -->

    <meta name="theme-color" content="#181615" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kliqtape</title>
