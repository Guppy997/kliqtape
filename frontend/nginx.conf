server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads: ein 10-Sekunden-Video kann ein paar MB haben, Default waere 1M.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Aufnahmen brauchen laenger als der Default von 60s, wenn die
    # Verbindung im Tailnet mal langsam ist.
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }

  # Der Service Worker darf nie aus dem Cache kommen, sonst haengt die App
  # auf einer alten Version fest.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
