name: Idee vorschlagen
description: Eine neue Funktion oder eine Verbesserung.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Kliqtape soll klein, ruhig und ehrlich bleiben. Ideen, die Reichweite, Zahlen oder
        einen endlosen Feed bringen, passen bewusst nicht dazu (siehe docs/CONCEPT.md, Abschnitt 11).
        Alles andere ist willkommen.

  - type: textarea
    id: problem
    attributes:
      label: Was fehlt dir?
      description: Beschreib die Situation in deiner Runde, nicht gleich die Lösung.
      placeholder: Wenn wir einen Ausflug planen, geht die Abstimmung auf Seite B unter, weil …
    validations:
      required: true

  - type: textarea
    id: idee
    attributes:
      label: Deine Idee
      description: Wie könnte es aussehen oder funktionieren? Skizzen sind willkommen.
    validations:
      required: true

  - type: textarea
    id: alternativen
    attributes:
      label: Was hast du stattdessen schon probiert?

  - type: checkboxes
    id: haltung
    attributes:
      label: Passt es zum Konzept?
      description: Diese Punkte sind bewusst ausgeschlossen.
      options:
        - label: Die Idee braucht keine öffentlichen Profile, Follower oder Reichweite.
          required: true
        - label: Die Idee zeigt keine Zahlen unter Beiträgen und sortiert nichts per Algorithmus.
          required: true
        - label: Die Idee kommt ohne Verbindungen zu Dritten aus (kein Tracking, kein CDN).
          required: true
